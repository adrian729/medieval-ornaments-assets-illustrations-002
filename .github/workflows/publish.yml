name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@ead4f752e65766903d3c18731f6dbfac37075ce7
    with:
      source: illustrations-002
      tooling-ref: ead4f752e65766903d3c18731f6dbfac37075ce7
      check-authentication: ${{ inputs.check-authentication }}
