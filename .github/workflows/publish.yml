name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@9f78d43442de8c89844c72078b73ed6b3e2c42fe
    with:
      source: illustrations-002
      tooling-ref: 9f78d43442de8c89844c72078b73ed6b3e2c42fe
      check-authentication: ${{ inputs.check-authentication }}
