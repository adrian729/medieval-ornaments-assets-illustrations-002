name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@de08342321ab5b4b9272a1a3c6980ae4335f6bc8
    with:
      source: illustrations-002
      tooling-ref: de08342321ab5b4b9272a1a3c6980ae4335f6bc8
      check-authentication: ${{ inputs.check-authentication }}
